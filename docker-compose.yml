version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mitori_engine:
    build:
      context: ./mitori_engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_HOST=${DATABASE_HOST}
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0 
      
      - PYTHONPATH=/app/core_cpp/build
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./mitori_engine:/app
    command: >
      bash -c "cd core_cpp && cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 2 && cd .. && uvicorn main:app --host 0.0.0.0 --port 8000"
  mitori_backend:
    build:
      context: ./mitori_backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_HOST=${DATABASE_HOST}
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./mitori_backend:/app
  trade_daemon:
    build:
      context: ./mitori_backend
    command: python manage.py trade_registery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mitori_backend:
        condition: service_started
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_HOST=${DATABASE_HOST}
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0

  cancellation_daemon:
    build:
      context: ./mitori_backend
    command: python manage.py settle_cancelled_orders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mitori_backend:
        condition: service_started
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_HOST=${DATABASE_HOST}
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
  benchmark_runner:
    build: ./benchmark
    profiles: ["testing"]
    privileged: true
    volumes:
      - ./benchmark:/app/benchmark
      - ./mitori_engine:/app/mitori_engine
    environment:
      - PYTHONPATH=/app
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "0-3"
    deploy:
      resources:
        limits:
          memory: 6G
volumes:
  postgres_data: