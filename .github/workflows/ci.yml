name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  django-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mitori_test
          POSTGRES_USER: mitori
          POSTGRES_PASSWORD: mitori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mitori -d mitori_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_NAME: mitori_test
      DATABASE_USER: mitori
      DATABASE_PASSWORD: mitori
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

      REDIS: "localhost"
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"

      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      JWT_SECRET_KEY: ci-test-shared-jwt-secret
      ALGORITHM: HS256

    defaults:
      run:
        working-directory: mitori_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mitori_backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python manage.py test

  fastapi-engine:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS: "localhost"
      REDIS_HOST: "localhost"
      REDIS_PORT: "6379"
      JWT_SECRET_KEY: ci-test-shared-jwt-secret
      ALGORITHM: HS256
      SYSTEM_PRECISION_MULTIPLIER: 100000000

    defaults:
      run:
        working-directory: mitori_engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mitori_engine/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest